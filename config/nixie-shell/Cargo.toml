[package]
name = "nixie-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "6"
futures = "0.3"
gio = "0.17"
glib = "0.17"
gtk = "0.17"
gtk-layer-shell = { version = "0.6.1", features = ["v0_6"] }
libc = "0.2"
libpulse-binding = "2.30"
log = "0.4"
notifier_host = { git = "https://github.com/elkowar/eww.git", rev = "d87c2fdbfdc012e76d229e4e9ea3325bc0f23e89", package = "notifier_host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9"
tzf-rs = "1.3"
zbus = { version = "3.15", default-features = false, features = ["tokio"] }
