<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Chinese text: fall back to Noto Sans CJK TC (Taiwan glyph forms) instead of
     whichever CJK face fontconfig happens to pick first (it chose the KR one). -->
<fontconfig>
  <!-- Nixie shell UI font has no CJK glyphs -->
  <match target="pattern">
    <test name="family"><string>Unbounded</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Sans Mono CJK TC</family></prefer>
  </alias>

  <!-- Any font asked to render Chinese prefers the TC face -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
</fontconfig>
