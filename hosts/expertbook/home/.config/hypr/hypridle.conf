# hypridle.conf — same timings as the arch machine.
# Dimming goes through ~/.local/bin/brightness (the panel backlight via DPCD).
general {
    lock_cmd = /home/brine/.config/hypr/scripts/lock-session.sh
    before_sleep_cmd = /home/brine/.config/hypr/scripts/lock-session.sh
    after_sleep_cmd = touch "$XDG_RUNTIME_DIR/nixie-resumed"; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; /home/brine/.local/bin/brightness apply; /home/brine/.local/bin/lid open # stamp for power-button; wake the display; re-apply your brightness (resume restores the boot-time level); resume apps paused at lid close
}

listener {
    timeout = 300                                       # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300                                       # 5 min: screen off (one rule, battery or AC, so waking turns it on once)
    on-timeout = /home/brine/.local/bin/lid rest            # screen off; on battery also pause apps (daytime stand-in for sleep)
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && /home/brine/.local/bin/brightness restore; /home/brine/.local/bin/lid open   # also resumes apps paused at lid close
}

# DISABLED 2026-11-22: s2idle never resumed on this machine (hard reboot needed).
# Re-enable once suspend/resume is verified working.
# listener {
#     timeout = 900                                       # 15 min: sleep, only on battery
#     on-timeout = [ "$(cat /sys/class/power_supply/AC0/online)" = 0 ] && systemctl suspend
# }

listener {
    timeout = 1800                                      # 30 min idle: hibernate on battery, only at night (23:00-09:00)
    on-timeout = /home/brine/.local/bin/idle-hibernate start   # waits (checking each minute) until both hold
    on-resume = /home/brine/.local/bin/idle-hibernate stop
}
