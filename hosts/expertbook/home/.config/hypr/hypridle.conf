# hypridle.conf. Sleep works since BIOS .312 (2026-11-25); the lid is logind's job
# (sleep, then hibernate after 2 h on battery).
# Dimming goes through ~/.local/bin/brightness (the panel backlight via DPCD).
general {
    lock_cmd = /home/brine/.config/hypr/scripts/lock-session.sh
    before_sleep_cmd = /home/brine/.config/hypr/scripts/lock-session.sh
    after_sleep_cmd = touch "$XDG_RUNTIME_DIR/nixie-resumed"; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; /home/brine/.local/bin/brightness apply; qs ipc call power screen on; /home/brine/.config/hypr/scripts/relock.sh # stamp for power-button; wake the display; re-apply your brightness (resume restores the boot-time level); fresh hyprlock so the fingerprint works
}

listener {
    timeout = 300                                       # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300                                       # 5 min: screen off (one rule, battery or AC, so waking turns it on once)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'; qs ipc call power screen off   # shell pauses its animations
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && /home/brine/.local/bin/brightness restore; qs ipc call power screen on
}

listener {
    timeout = 330                                       # 5.5 min, on battery only: sleep; after 2 h asleep it hibernates (sleep.conf)
    on-timeout = /home/brine/.local/bin/on-ac || systemctl suspend-then-hibernate
}

