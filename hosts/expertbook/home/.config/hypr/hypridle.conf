# hypridle.conf — same timings as the arch machine.
# Dimming goes through ~/.local/bin/brightness (software dimming; the panel stays at 100%).
general {
    lock_cmd = /home/brine/.config/hypr/scripts/lock-session.sh
    before_sleep_cmd = /home/brine/.config/hypr/scripts/lock-session.sh
    after_sleep_cmd = touch "$XDG_RUNTIME_DIR/nixie-resumed"; hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # stamp for power-button; avoid pressing a key twice to wake the display
}

listener {
    timeout = 300                                       # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                       # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && /home/brine/.local/bin/brightness restore
}

listener {
    timeout = 900                                       # 15 min: sleep, only on battery
    on-timeout = [ "$(cat /sys/class/power_supply/AC0/online)" = 0 ] && systemctl suspend
}
