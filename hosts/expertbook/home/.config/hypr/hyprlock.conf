# hyprlock.conf — ported from the arch machine, scaled 0.7x for 1440x900 logical (2880x1800 @2x)
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = NewComputerModern08
$monitor = eDP-1

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
auth {
    fingerprint {
        enabled = true
        ready_message = Touch the sensor or type your password
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = $monitor
        path = /home/brine/.config/hypr/data/lockscreen.jpg
# path = /home/brine/.config/hypr/data/wallpaper.jpg
    # blur_passes = 0
}

input-field {
    monitor = $monitor
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(ffac1cee)
    check_color = rgba(ad722eee)
    fail_color = rgba(ee4b2bee)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    placeholder_text = <span font_weight="bold" size="21pt">Ελ Ψάι Κονγκρού</span>
    fail_text = <span font_weight="bold" size="21pt">$PAMFAIL</span>
    font_family = $font

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_size = 0.4

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    hide_input = false
    dots_text_format = 　

    position = 0, -280
    halign = center
    valign = center
}

# TIME
label {
    monitor = $monitor
    font_color = rgb(255, 172, 28)
    font_family = BO NX Medium
    font_size = 63
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution

    position = -21, -21
    halign = right
    valign = top
}


# DATE
label {
    monitor = $monitor
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +'%A, %d %B %Y' # update every 60 seconds
    font_color = rgb(255, 172, 28)
    font_size = 18
    font_family = $font

    position = -21, -105
    halign = right
    valign = top
}

