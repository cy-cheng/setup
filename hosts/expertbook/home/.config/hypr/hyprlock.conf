# RANDOM NUMBER GENERATOR

label {
    monitor = $monitor

    # text = cmd[update:10] pid=$(pgrep -x hyprlock | tail -n1); age=$(ps -o etimes= -p $pid | tr -d ' '); if [ "$((age % 60))" -lt 2 ]; then echo "<span color='##CE7D40' font_features='tnum'>$((RANDOM % 10)) $(printf '%06d' $(((RANDOM * 13) % 1000000)))</span>"; else hash=$(echo "$pid + ($age) // 60" | cksum | awk '{print $1}'); echo "<span color='##E6945C' font_features='tnum'>$((pid % 2)) $(printf '%06d' $((hash % 1000000)))</span>"; fi
    text = cmd[update:10] ts=$(date +%s); start=$(stat -c %Y /proc/$PPID); if [ "$(((ts - start) % 60))" -lt 2 ]; then echo "<span color='##CE7D40' font_features='tnum'>$((RANDOM % 10)) $(printf '%06d' $(((RANDOM * 13) % 1000000)))</span>"; else hash=$(echo "$((PPID ))" | cksum | awk '{print $1}'); echo "<span color='##E6945C' font_features='tnum'>$(( (hash / 1000000) % 2 )) $(printf '%06d' $((hash % 1000000)))</span>"; fi

    font_size = 196
    font_family = BO NX Medium

    position = 0, 0
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(202, 96, 11, 0.6)
    shadow_boost = 1.75
}

