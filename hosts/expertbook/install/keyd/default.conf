# keyd: the Copilot key (right of right Alt) acts as Super.
# The firmware sends it as Super+Shift+F23 all at once, so it can't be remapped
# with hwdb (Super and Shift share scancodes with the real keys); keyd catches the
# chord and sends Super instead.
[ids]
# AT Translated Set 2 keyboard (the laptop's own). No comments on the id line: keyd
# then doesn't match it.
0001:0001

[main]
leftshift+leftmeta+f23 = leftmeta
