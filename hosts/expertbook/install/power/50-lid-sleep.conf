[Login]
# Lid closed: sleep (s2idle works since BIOS .312, 2026-11-25). On battery it turns
# into hibernate after HibernateDelaySec (90-sleep.conf); plugged in it just sleeps.
# An external monitor attached ("docked"): nothing, you're using it.
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
