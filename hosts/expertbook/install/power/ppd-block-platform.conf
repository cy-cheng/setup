# power-profiles-daemon must not write the platform profile itself: the
# power-profile-bridge maps each profile onto BOTH firmware sliders (ASUS + SoC).
# Without this, power-saver -> bridge writes quiet/low-power -> ppd sees "custom"
# and falls back to balanced.
[Service]
ExecStart=
ExecStart=/usr/lib/power-profiles-daemon --block-driver=platform_profile
