# Battery-empty action. UPower's "Auto" picks suspend-then-hibernate, and suspend
# (s2idle) never resumes on this machine: on 2026-11-24 it hung at 2% and the
# battery ran flat. Hibernate directly, a little earlier so the image has time to write.
[UPower]
PercentageCritical=6.0
PercentageAction=4.0
CriticalPowerAction=Hibernate
