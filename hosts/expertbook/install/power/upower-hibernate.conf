# Battery-empty backup. The shell (services/Sys.qml) does the real work: it warns at
# 20, 10 and 5 %, hibernates at <= 5 % once you're away, and at 1 % regardless.
# This is only for when the shell isn't running. UPower's "Auto" would pick
# suspend-then-hibernate, and suspend never resumes on this machine (on 2026-11-24
# it hung at 2 % and the battery ran flat), so hibernate directly.
[UPower]
PercentageLow=20.0
PercentageCritical=5.0
PercentageAction=1.0
CriticalPowerAction=Hibernate
